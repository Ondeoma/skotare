# docker-compose.ha.yml のロードバランサー. /healthz で生きているノードにだけ振り分ける
global
  log stdout format raw local0
defaults
  mode http
  timeout connect 5s
  timeout client 60s
  timeout server 60s
frontend web
  bind :8080
  # 利用者の IP を X-Forwarded-For で渡す（skotare 側は TRUSTED_PROXIES で受け入れる）
  option forwardfor
  default_backend skotare
backend skotare
  option httpchk GET /healthz
  http-check expect status 200
  server node-a node-a:8080 check inter 5s fall 2 rise 2
  server node-b node-b:8080 check inter 5s fall 2 rise 2
  server node-c node-c:8080 check inter 5s fall 2 rise 2
