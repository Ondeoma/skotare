<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="skotare">
  <!-- 脈の線が走るモニターを抱えたコタレ（kōtare. ニュージーランドのカワセミ. 青緑の背とクリーム色の首元、長いくちばしが目印）.
       台紙・芽・丸い頭・目は兄弟（stui・skorimako・skea・skuaka・skereru）と同じ形 -->
  <rect width="160" height="160" rx="36" fill="#FFF4D6"/>
  <path d="M80 31q-12-13-4-27q14 7 4 27z" fill="#0F766E"/><path d="M80 31q13-10 21-4q-8 12-21 4z" fill="#2BB5A0"/>
  <circle cx="80" cy="80" r="50" fill="#2A9AA8"/>
  <path d="M36 66q6-34 44-36q38 2 44 36q-18-16-44-16q-26 0-44 16z" fill="#1D6F8C"/>
  <path d="M36 92q44-22 88 0v20H36z" fill="#F3E3C3"/>
  <circle cx="66" cy="62" r="5" fill="#13202E"/><circle cx="67.5" cy="60.5" r="1.6" fill="#fff"/><circle cx="94" cy="62" r="5" fill="#13202E"/><circle cx="95.5" cy="60.5" r="1.6" fill="#fff"/>
  <ellipse cx="55" cy="76" rx="7" ry="4" fill="#F4A3A3"/><ellipse cx="105" cy="76" rx="7" ry="4" fill="#F4A3A3"/>
  <path d="M74 65q6-5 12 0l-6 24z" fill="#2A2F38"/>
  <!-- モニター -->
  <rect x="32" y="94" width="96" height="56" rx="9" fill="#17323A" stroke="#D9CBB0" stroke-width="1.5"/>
  <path d="M40 124h18l6-12 8 26 8-34 7 20h33" stroke="#34D399" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="117" cy="104" r="3.5" fill="#34D399"/>
  <ellipse cx="42" cy="96" rx="9" ry="6" fill="#2A9AA8"/><ellipse cx="118" cy="96" rx="9" ry="6" fill="#2A9AA8"/>
</svg>
