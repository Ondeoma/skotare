# 冗長構成の例: 同じ PostgreSQL を使う skotare を3台並べ、HAProxy で振り分ける（scripts/dist.sh の後に docker compose -f docker-compose.ha.yml up --build）
# 拠点は tokyo（node-a・node-b）と osaka（node-c）. 実際には拠点ごとに別の場所（データセンター・リージョン・回線）に置く
# 本番では PostgreSQL も冗長にする（stui の deploy/ にある Patroni の例などを参照）
name: skotare-ha
x-app: &app
  build: { context: ., dockerfile: deploy/docker/app.Dockerfile }
  environment: &env
    DATABASE_URL: jdbc:postgresql://db:5432/skotare
    DATABASE_USER: skotare
    DATABASE_PASSWORD: skotare
    PUBLIC_URL: http://localhost:8180
    # 例なので名前だけでログインできるようにしている（本番では OIDC_* を設定し、DEV_LOGIN は外す）.
    # 開発用のログインは既定で 127.0.0.1 でだけ待ち受けるので、ロードバランサーから届くよう BIND_HOST を明示する
    # （ホストへは 127.0.0.1 のポートだけを出している）
    DEV_LOGIN: "true"
    BIND_HOST: 0.0.0.0
    # ロードバランサーの付ける X-Forwarded-For を信じる（ログインの回数制限を、ロードバランサーの IP でなく利用者ごとに数える）
    TRUSTED_PROXIES: 172.16.0.0/12
    APP_SECRET: change-me-to-a-long-random-value   # 本番では十分に長い乱数にする（DB のパスワードも同じ）
  # PING（ICMP）を送れるようにする
  cap_add: [NET_RAW]
  sysctls: { net.ipv4.ping_group_range: "0 2147483647" }
  depends_on: { db: { condition: service_healthy } }
  restart: unless-stopped
services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: skotare, POSTGRES_PASSWORD: skotare, POSTGRES_DB: skotare }
    volumes: [hadata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "skotare"], interval: 2s, retries: 30 }
  node-a:
    <<: *app
    environment: { <<: *env, NODE_NAME: node-a, REGION: tokyo }
  node-b:
    <<: *app
    environment: { <<: *env, NODE_NAME: node-b, REGION: tokyo }
  node-c:
    <<: *app
    environment: { <<: *env, NODE_NAME: node-c, REGION: osaka }
  lb:
    image: haproxy:3.0-alpine
    volumes: [./deploy/docker/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro]
    ports: ["127.0.0.1:8180:8080"]
    depends_on: [node-a, node-b, node-c]
volumes:
  hadata:
