# 開発用: PostgreSQL（ほかの開発環境とぶつからないよう、ポートを既定からずらしている）
name: skotare
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skotare
      POSTGRES_PASSWORD: skotare
      POSTGRES_DB: skotare
    ports: ["127.0.0.1:54389:5432"]   # 手元からだけ（LAN に開かない）
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/docker/dev-initdb.sql:/docker-entrypoint-initdb.d/10-skotare-test.sql:ro   # テスト用DB skotare_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skotare"]
      interval: 2s
      retries: 30
volumes:
  pgdata:
